<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PSYXO-KARAOKE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const TITLE = 'PSYXO-KARAOKE';
const SWITCH_MS = 5000;           // смена анимации каждые 5 секунд

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, DPR;

function fontSize(){ return Math.max(20, Math.min(W * 0.92 / (TITLE.length * 0.62), H * 0.28)); }
function font(sz){ return 'bold ' + sz + 'px "Courier New", monospace'; }
function black(){ ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }

/* ---------- 0. MATRIX ---------- */
const CH = 18;
const GLYPHS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF<>/+*';
let cols, drops;
function initMatrix(){
  cols = Math.ceil(W / CH);
  drops = Array.from({length: cols}, () => Math.random() * H / CH);
}
function matrix(){
  ctx.fillStyle = 'rgba(0,0,0,0.09)';
  ctx.fillRect(0, 0, W, H);
  ctx.font = CH + 'px monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (let i = 0; i < cols; i++){
    const y = drops[i] * CH;
    ctx.fillStyle = '#0f6';
    ctx.fillText(GLYPHS[(Math.random() * GLYPHS.length) | 0], i * CH, y - CH);
    ctx.fillStyle = '#fff';
    ctx.fillText(GLYPHS[(Math.random() * GLYPHS.length) | 0], i * CH, y);
    if (y > H && Math.random() > 0.975) drops[i] = 0;
    drops[i] += 0.7;
  }
  const sz = fontSize();
  ctx.font = font(sz); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = sz * 0.12; ctx.strokeStyle = '#000';
  ctx.strokeText(TITLE, W / 2, H / 2);
  ctx.shadowColor = '#0f6'; ctx.shadowBlur = 25;
  ctx.fillStyle = '#d6ffe6';
  ctx.fillText(TITLE, W / 2, H / 2);
  ctx.shadowBlur = 0;
}

/* ---------- 1. GLITCH ---------- */
function glitch(t){
  black();
  const sz = fontSize(), cx = W / 2, cy = H / 2;
  ctx.font = font(sz); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const j = Math.random() < 0.2 ? (Math.random() * 30 - 15) : 0;
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = '#f00'; ctx.fillText(TITLE, cx - 7 + j, cy);
  ctx.fillStyle = '#0ff'; ctx.fillText(TITLE, cx + 7 - j, cy);
  ctx.fillStyle = '#50f'; ctx.fillText(TITLE, cx, cy + (Math.random() < 0.1 ? 6 : 0));
  ctx.globalCompositeOperation = 'source-over';
  for (let k = 0; k < 5; k++){
    if (Math.random() < 0.5){
      const sy = cy - sz / 2 + Math.random() * sz;
      const sh = 3 + Math.random() * sz * 0.15;
      const dx = Math.random() * 120 - 60;
      ctx.drawImage(cv, 0, sy * DPR, W * DPR, sh * DPR, dx, sy, W, sh);
    }
  }
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
}

/* ---------- 2. NEON WAVE ---------- */
function wave(t){
  black();
  const sz = fontSize();
  ctx.font = font(sz); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const cw = ctx.measureText('M').width;
  const x0 = W / 2 - cw * TITLE.length / 2;
  for (let i = 0; i < TITLE.length; i++){
    const y = H / 2 + Math.sin(t / 300 + i * 0.6) * sz * 0.3;
    const col = 'hsl(' + ((t / 12 + i * 25) % 360) + ',100%,60%)';
    ctx.shadowColor = col; ctx.shadowBlur = 28;
    ctx.fillStyle = col;
    ctx.fillText(TITLE[i], x0 + cw * (i + 0.5), y);
  }
  ctx.shadowBlur = 0;
}

/* ---------- 3. STARFIELD ---------- */
let stars;
function initStars(){
  stars = Array.from({length: 450}, () => ({
    x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, z: Math.random()
  }));
}
function starfield(t){
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, s = Math.max(W, H) * 0.6;
  for (const st of stars){
    const pz = st.z;
    st.z -= 0.012;
    if (st.z <= 0.01){ st.x = Math.random() * 2 - 1; st.y = Math.random() * 2 - 1; st.z = 1; continue; }
    const x1 = cx + st.x / pz * s * 0.15, y1 = cy + st.y / pz * s * 0.15;
    const x2 = cx + st.x / st.z * s * 0.15, y2 = cy + st.y / st.z * s * 0.15;
    ctx.strokeStyle = 'hsl(' + ((t / 20 + st.x * 90) % 360) + ',90%,' + (60 + (1 - st.z) * 40) + '%)';
    ctx.lineWidth = 1 + (1 - st.z) * 2.5;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  const sz = fontSize() * (1 + Math.sin(t / 400) * 0.06);
  ctx.font = font(sz); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = sz * 0.1; ctx.strokeStyle = '#000';
  ctx.strokeText(TITLE, cx, cy);
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 20;
  ctx.fillStyle = '#fff';
  ctx.fillText(TITLE, cx, cy);
  ctx.shadowBlur = 0;
}

/* ---------- 4. EQUALIZER ---------- */
function eq(t){
  black();
  const n = 48, bw = W / n;
  for (let i = 0; i < n; i++){
    const v = (Math.sin(t / 230 + i * 0.5) + Math.sin(t / 370 + i * 1.3) + Math.sin(t / 110 + i * 0.21) + 3) / 6;
    const h = v * H * 0.55;
    const g = ctx.createLinearGradient(0, H, 0, H - h);
    g.addColorStop(0, '#ff2bd6'); g.addColorStop(1, '#2bf0ff');
    ctx.fillStyle = g;
    ctx.fillRect(i * bw + 2, H - h, bw - 4, h);
  }
  const sz = fontSize();
  ctx.font = font(sz); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = '#ff2bd6'; ctx.shadowBlur = 30;
  ctx.fillStyle = '#fff';
  ctx.fillText(TITLE, W / 2, H * 0.32);
  ctx.shadowBlur = 0;
}

const MODES = [matrix, glitch, wave, starfield, eq];
let mode = 0, last = 0, started = false;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  black(); initMatrix(); initStars();
}
addEventListener('resize', resize);
resize();

function frame(t){
  if (!started){ last = t; started = true; }
  if (t - last > SWITCH_MS){
    last = t; mode = (mode + 1) % MODES.length;
    black();
  }
  MODES[mode](t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
